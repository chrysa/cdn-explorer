name: cdn-explorer
services:
  api:
    build:
      context: .
      target: production
    environment:
      ALLOWED_ORIGINS: '["http://localhost:5173","http://localhost:8011"]'
      DEBUG: 'false'
    network_mode: host
  frontend:
    build:
      args:
        VITE_API_URL: http://localhost:8000
      context: ./app
      target: production
    depends_on:
      api:
        condition: service_healthy
    ports:
    - 8011:80
volumes: {}
